---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  labels:
    openmcp.cloud/cluster: platform
  name: notificationrecords.notifications.platform.open-control-plane.io
spec:
  group: notifications.platform.open-control-plane.io
  names:
    kind: NotificationRecord
    listKind: NotificationRecordList
    plural: notificationrecords
    shortNames:
    - notifrec
    singular: notificationrecord
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .spec.channel
      name: Channel
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NotificationRecord is a durable dedup-ledger entry ensuring a given notification is
          delivered to a given recipient at most once.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the recorded notification
            properties:
              category:
                description: Category is the activity category.
                enum:
                - MembershipAdded
                - UserEnablement
                - NewServiceVersion
                type: string
              channel:
                description: Channel is the delivery channel this record tracks.
                enum:
                - Email
                - Slack
                type: string
              eventKey:
                description: |-
                  EventKey is the human-readable identity of the underlying event, e.g.
                  "project/platform-team:member:alice@example.com:admin" or "service/crossplane:v2.3.4".
                type: string
              recipient:
                description: Recipient is the identity the notification is addressed
                  to.
                properties:
                  kind:
                    description: Kind is the kind of the subject.
                    enum:
                    - User
                    - Group
                    - ServiceAccount
                    type: string
                  name:
                    description: Name is the identity string. For Kind=User this is
                      the OIDC username (an email in practice).
                    type: string
                  namespace:
                    description: Namespace is only required for Kind=ServiceAccount.
                    type: string
                required:
                - kind
                - name
                type: object
              recipientAddress:
                description: RecipientAddress is the resolved delivery address (email
                  address, Slack handle, ...).
                type: string
            required:
            - category
            - channel
            - eventKey
            - recipient
            type: object
          status:
            description: status defines the delivery state
            properties:
              attempts:
                description: Attempts is the number of delivery attempts made.
                format: int32
                type: integer
              conditions:
                description: Conditions contains the conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastError:
                description: LastError is the error from the most recent failed attempt.
                type: string
              phase:
                description: Phase is the current delivery phase.
                enum:
                - Pending
                - Delivered
                - Failed
                - Suppressed
                type: string
              sentAt:
                description: SentAt is when delivery succeeded.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
